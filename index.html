<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>低多边形 · 翼龙转向 · 滚轮漫游 · 蘑菇散布</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft YaHei', sans-serif;
            background-color: #1a2a3a;
        }
        .title-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            pointer-events: none;
            z-index: 200;
            transition: opacity 1.5s ease-out;
            transform: translateY(-8vh); 
        }
        /* 以下为新增的副标题样式 */
        .subtitle-text {
            font-size: 3.5vh;
            font-weight: 400;
            color: #efe6d8;
            text-shadow: 0 0 15px rgba(0,0,0,0.4);
            letter-spacing: 0.15em;
            margin-top: 1vh;
            opacity: 0.9;
            font-family: 'Microsoft YaHei', 'Poppins', sans-serif;
            animation: gentlePulseSub 2s ease-out;
        }
        @keyframes gentlePulseSub {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 0.9; transform: translateY(0); }
        }
        .enter-text {
            position: absolute;
            bottom: 10vh;               /* 距底部距离，可按需调整 */
            left: 50%;
            transform: translateX(-50%);
            font-size: 5vh;
            font-weight: 600;
            color: #efe6d8;
            text-shadow: 0 0 12px rgba(0,0,0,0.5);
            letter-spacing: 0.2em;
            opacity: 0.85;
            pointer-events: auto;       /* 如需点击交互可启用 */
            cursor: pointer;
            font-family: 'Poppins', 'Microsoft YaHei', sans-serif;
            animation: enterPulse 2.5s ease-in-out infinite;
        }
        @keyframes enterPulse {
            0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
        .title-text {
            font-size: 17vh;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.5), 0 0 8px rgba(0,0,0,0.3);
            letter-spacing: 0.08em;
            margin-bottom: 0;
            line-height: 1;   
            font-family: 'Poppins', 'Segoe UI', 'Impact', sans-serif;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: white;
            text-shadow: 0 0 30px rgba(0,0,0,0.6);
            animation: gentlePulse 2s ease-out;
        }
        @keyframes gentlePulse {
            0% { opacity: 0; transform: scale(0.92); text-shadow: 0 0 0px white; }
            20% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 20px rgba(255,255,200,0.8); }
            100% { opacity: 1; transform: scale(1); text-shadow: 0 0 30px rgba(0,0,0,0.6); }
        }
        
        .music-control {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 300;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(20, 30, 25, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(217, 179, 130, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #efe6d8;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .music-control:hover {
            background: rgba(217, 179, 130, 0.35);
            border-color: #f0c080;
            transform: scale(1.08);
        }
        .music-control:active {
            transform: scale(0.95);
        }
        .hint-bubble {
            position: fixed;
            z-index: 250;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(74, 74, 74, 0.5);
            backdrop-filter: blur(6px);
            color: #efe6d8;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
            transform: translate(-50%, -120%)translateX(-10px);
            border: 2px solid rgba(0, 0, 0, 0.5);
        }
        #imageOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 400;
    display: flex;                /* 始终 flex 以便居中 */
    align-items: center;
    justify-content: center;
    opacity: 0;                   /* 默认透明 */
    pointer-events: none;         /* 透明时不可点击 */
    transition: opacity 0.5s ease-out;  /* 0.5 秒淡出动画 */
}
#imageOverlay.show {
    opacity: 1;
    pointer-events: auto;         /* 显示时可交互 */
}
.corner-info {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 250;
    display: flex;
    flex-direction: column;
    align-items: center;          /* 让 Logo 与文字居中对齐 */
    pointer-events: none;
}

/* Logo 图片（移除独立定位，现在由容器控制） */
.corner-logo {
    max-width: 45px;
    height: auto;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
    margin-bottom: 6px;           /* Logo 与文字间的间距 */
}

/* 中文文字 */
.corner-text {
    font-size: 10px;
    font-weight: 500;
    color: #efe6d8;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
    letter-spacing: 0.08em;
    line-height: 1.4;
    font-family: 'Microsoft YaHei', 'Poppins', sans-serif;
}

/* 英文文字 */
.corner-text-en {
    font-size: 8px;
    font-weight: 400;
    color: #efe6d8;
    text-shadow: 0 0 6px rgba(0,0,0,0.5);
    letter-spacing: 0.05em;
    line-height: 1.3;
    font-family: 'Poppins', 'Microsoft YaHei', sans-serif;
}
    </style>
</head>
<body>
    <div id="musicToggle" class="music-control" title="音乐开关">🕩</div>
    <div class="corner-info">
    <img id="cornerLogo" src="./bb.png" class="corner-logo" alt="角落标识">
    <div class="corner-text">关于我们</div>
    <div class="corner-text-en">About us</div>
</div>
    <div id="startTitle" class="title-overlay">
    <div class="title-text">DINOSAURS</div>
    <div class="subtitle-text">成都自然博物馆恐龙厅动态游览</div>
    <div class="enter-text" id="enterBtn">ENTER</div>
    </div>

<div id="imageOverlay">
    <img src="./aa.jpg" style="max-width:80%; max-height:80%; border-radius:20px; box-shadow:0 0 40px rgba(0,0,0,0.8); cursor:pointer;" alt="导览图">
</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>
    <div id="spinoHint" class="hint-bubble">哈哈</div>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        function createGradientSky() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0e7de9');
            gradient.addColorStop(0.59, '#eaaf74');
            gradient.addColorStop(1, '#c57c35');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.background = createGradientSky();
        scene.fog = new THREE.FogExp2(0xdaa679, 0.022);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const outlineShader = {
            uniforms: {
                tDiffuse: { value: null },
                edgeColor: { value: new THREE.Color(0x000000) },
                edgeStrength: { value: 1.5 },
                bgMix: { value: 1.2 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec3 edgeColor;
                uniform float edgeStrength;
                uniform float bgMix;
                varying vec2 vUv;
                
                void main() {
                    vec2 texelSize = 1.0 / vec2(textureSize(tDiffuse, 0));
                    vec3 color = texture2D(tDiffuse, vUv).rgb;
                    
                    float gx = 0.0;
                    float gy = 0.0;
                    
                    for (int i = -1; i <= 1; i++) {
                        for (int j = -1; j <= 1; j++) {
                            vec2 offset = vec2(float(i), float(j)) * texelSize;
                            float lum = dot(texture2D(tDiffuse, vUv + offset).rgb, vec3(0.299, 0.587, 0.114));
                            
                            float kernelX = 0.0;
                            if (i == -1) kernelX = -1.0;
                            if (i == 1) kernelX = 1.0;
                            if (j == -1) kernelX *= 1.0;
                            if (j == 0) kernelX *= 2.0;
                            if (j == 1) kernelX *= 1.0;
                            
                            float kernelY = 0.0;
                            if (j == -1) kernelY = -1.0;
                            if (j == 1) kernelY = 1.0;
                            if (i == -1) kernelY *= 1.0;
                            if (i == 0) kernelY *= 2.0;
                            if (i == 1) kernelY *= 1.0;
                            
                            gx += lum * kernelX;
                            gy += lum * kernelY;
                        }
                    }
                    
                    float edge = sqrt(gx*gx + gy*gy);
                    edge = clamp(edge * edgeStrength, 0.0, 1.0);
                    vec3 finalColor = mix(color, edgeColor, edge);
                    finalColor = mix(finalColor, color, 1.0 - bgMix * 0.2);
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        };

        const outlinePass = new ShaderPass(outlineShader);
        outlinePass.renderToScreen = true;
        composer.addPass(outlinePass);

        // ========== 地形高度函数 ==========
        function getTerrainHeight(x, z) {
            let y = -1.6;
            y += Math.sin(x * 0.18) * 0.32;
            y += Math.cos(z * 0.22) * 0.32;
            y += Math.sin(x * 0.45 + 1.2) * 0.22;
            y += Math.cos(z * 0.5 + 0.7) * 0.22;
            y += Math.sin(x * 1.2 + z * 0.9) * 0.1;
            y += Math.cos(z * 1.3 - x * 0.8) * 0.08;
            const edgeFactor = 1.0 - Math.min(1.0, Math.abs(x) / 45.0) * 0.2;
            return y * edgeFactor;
        }

        // ========== 1. 起伏地面 ==========
        const groundColorHex = 0x333919;
        const groundColorObj = new THREE.Color(groundColorHex);

        const width = 136;
        const depth = 164;
        const segmentsX = 136;
        const segmentsZ = 164;
        const geometry = new THREE.PlaneGeometry(width, depth, segmentsX, segmentsZ);
        geometry.rotateX(-Math.PI / 2);
        const positions = geometry.attributes.position.array;
        const colors = [];
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i + 2];
            const y = getTerrainHeight(x, z);
            positions[i + 1] = y;
            colors.push(groundColorObj.r, groundColorObj.g, groundColorObj.b);
        }
        geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
        geometry.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.8,
            metalness: 0.0,
            flatShading: true,
            emissive: new THREE.Color(0x222222)
        });
        const groundMesh = new THREE.Mesh(geometry, groundMat);
        groundMesh.receiveShadow = true;
        groundMesh.castShadow = false;
        scene.add(groundMesh);

        // ========== 2. 蜿蜒路径曲线 ==========
        const curvePoints = [
            new THREE.Vector3(0, 0.5, 50),
            new THREE.Vector3(0, 0.5, 40),
            new THREE.Vector3(0, 1.2, 34),
            new THREE.Vector3(0, 1.2, 28), new THREE.Vector3(0, 1.2, 24),
            new THREE.Vector3(0, 1.2, 20), new THREE.Vector3(0, 1.2, 16),
            new THREE.Vector3(2, 2.0, 12), new THREE.Vector3(4, 3.0, 8),
            new THREE.Vector3(2, 4.0, 4), new THREE.Vector3(-1, 4.5, 0),
            new THREE.Vector3(-4, 4.0, -4), new THREE.Vector3(-3, 3.0, -8),
            new THREE.Vector3(0, 2.0, -12), new THREE.Vector3(4, 2.0, -16),
            new THREE.Vector3(3, 2.0, -20), new THREE.Vector3(-1, 0.5, -24),
            new THREE.Vector3(-4, -0.2, -28), new THREE.Vector3(-2, 0.5, -32),
            new THREE.Vector3(2, 1.8, -36), new THREE.Vector3(5, 1.5, -40),
            new THREE.Vector3(3, 1.8, -44),
            new THREE.Vector3(0, 1.8, -50),
            new THREE.Vector3(-3, 2.5, -56),
            new THREE.Vector3(2, 1.5, -62),
            new THREE.Vector3(5, 1.0, -68),
            new THREE.Vector3(1, 0.5, -74),
            new THREE.Vector3(-2, 0.0, -80)
        ];

        const cameraCurve = new THREE.CatmullRomCurve3(curvePoints);
        cameraCurve.curveType = 'centripetal';
        cameraCurve.closed = false;
        cameraCurve.tension = 0.5;

        const trailPoints = cameraCurve.getPoints(600);
        const trailGeometry = new THREE.BufferGeometry().setFromPoints(trailPoints);
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0x88aacc });
        const curveTrail = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(curveTrail);

        // ========== 3. 道路 (石子小径) ==========
        const pathWidth = 5.0;
        const segmentsPerMeter = 1.8;
        const totalLength = cameraCurve.getLength();
        const numSegments = Math.max(50, Math.floor(totalLength * segmentsPerMeter));

        const samples = [];
        for (let i = 0; i <= numSegments; i++) {
            const t = i / numSegments;
            const point = cameraCurve.getPoint(t);
            const tangent = cameraCurve.getTangent(t).normalize();
            samples.push({ point, tangent });
        }

        const vertices = [];
        const indices = [];
        const normals = [];
        const uvs = [];
        const up = new THREE.Vector3(0, 1, 0);

        for (let i = 0; i < samples.length; i++) {
            const { point, tangent } = samples[i];
            const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
            const terrainY = getTerrainHeight(point.x, point.z);
            const yPos = terrainY + 0.12;
            const left = point.clone().add(right.clone().multiplyScalar(-pathWidth / 2));
            const rightPt = point.clone().add(right.clone().multiplyScalar(pathWidth / 2));
            left.y = yPos;
            rightPt.y = yPos;
            vertices.push(left.x, left.y, left.z);
            vertices.push(rightPt.x, rightPt.y, rightPt.z);
            normals.push(0, 1, 0, 0, 1, 0);
            uvs.push(0, i / numSegments);
            uvs.push(1, i / numSegments);
        }

        for (let i = 0; i < samples.length - 1; i++) {
            const idx = i * 2;
            indices.push(idx, idx + 1, idx + 2);
            indices.push(idx + 1, idx + 3, idx + 2);
        }

        const pathGeometry = new THREE.BufferGeometry();
        pathGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
        pathGeometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(normals), 3));
        pathGeometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        pathGeometry.setIndex(indices);
        pathGeometry.computeVertexNormals();

        function createGravelTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#a08c7a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 1200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = 3 + Math.random() * 8;
                const gray = 80 + Math.random() * 60;
                const color = `rgb(${gray + 20}, ${gray - 10}, ${gray - 20})`;
                ctx.fillStyle = color;
                ctx.beginPath();
                const points = 5 + Math.floor(Math.random() * 4);
                for (let j = 0; j < points; j++) {
                    const angle = (j / points) * Math.PI * 2;
                    const r = radius * (0.7 + Math.random() * 0.6);
                    const px = x + Math.cos(angle) * r;
                    const py = y + Math.sin(angle) * r;
                    if (j === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                if (Math.random() > 0.7) {
                    ctx.fillStyle = '#d4c4b4';
                    ctx.beginPath();
                    ctx.arc(x - 2, y - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.fillStyle = '#8a7a6a';
            for (let i = 0; i < 2000; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 20);
            return texture;
        }

        const gravelTexture = createGravelTexture();
        const pathMat = new THREE.MeshStandardMaterial({
            map: gravelTexture,
            roughness: 0.9,
            metalness: 0.0,
            flatShading: true,
            emissive: new THREE.Color(0x332211),
            emissiveIntensity: 0.15
        });
        const pathMesh = new THREE.Mesh(pathGeometry, pathMat);
        pathMesh.receiveShadow = true;
        pathMesh.castShadow = false;
        scene.add(pathMesh);

        const startPoint = cameraCurve.getPoint(0);

        // ═══════════════════════════════════════════════════════════════
        const keyframes = [
             { p: 0.0, yaw: 0, pitch: 5 },
            { p: 0.05, yaw: 30, pitch: 10 },
            { p: 0.25, yaw: -90, pitch: 0 },
            { p: 0.5, yaw: 100, pitch: 10 },
            { p: 0.55, yaw: 80, pitch: 20 },
            { p: 0.75, yaw: -75, pitch: 15 },
            { p: 0.85, yaw: 110, pitch: 0 },
            { p: 0.90, yaw: 100, pitch: 0 },
            { p: 1.0, yaw: 0, pitch: 0 }
        ];

        function getLookAngles(progress) {
            for (let i = 0; i < keyframes.length - 1; i++) {
                if (progress >= keyframes[i].p && progress <= keyframes[i + 1].p) {
                    const t = (progress - keyframes[i].p) / (keyframes[i + 1].p - keyframes[i].p);
                    return {
                        yaw: keyframes[i].yaw + (keyframes[i + 1].yaw - keyframes[i].yaw) * t,
                        pitch: keyframes[i].pitch + (keyframes[i + 1].pitch - keyframes[i].pitch) * t
                    };
                }
            }
            return { yaw: keyframes[0].yaw, pitch: keyframes[0].pitch };
        }

        // ═══════════════════════════════════════════════════════════════
        // ✨ 中心模型
        // ═══════════════════════════════════════════════════════════════
        const centerModelPos = {
            x: startPoint.x,
            z: startPoint.z + (-17)
        };
        const centerModelTerrainY = getTerrainHeight(centerModelPos.x, centerModelPos.z);
        const centerModelY = centerModelTerrainY + 0.1;

        const centerLoader = new GLTFLoader();
        const centerModelUrl = './models/stylize-tree-lowpoly/forest_passage.glb';

        centerLoader.load(centerModelUrl,
            (gltf) => {
                const model = gltf.scene;
                const scaleVal = 1.28;
                model.scale.set(scaleVal, scaleVal, scaleVal);
                model.position.set(centerModelPos.x, centerModelY, centerModelPos.z);
                model.rotation.y = 0.3;
                model.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            const materials = Array.isArray(child.material) ? child.material : [child.material];
                            materials.forEach(mat => {
                                mat.flatShading = true;
                                mat.roughness = 0.75;
                                mat.metalness = 0.05;
                                mat.needsUpdate = true;
                            });
                        }
                    }
                });
                scene.add(model);
            },
            undefined,
            (error) => console.error('中心模型加载失败:', error)
        );

        // ═══════════════════════════════════════════════════════════════
        // 🌟 洞穴漂浮发光粒子系统
        // ═══════════════════════════════════════════════════════════════
        const caveParticleCount = 260;
        const caveParticleGeo = new THREE.BufferGeometry();
        const cavePositions = new Float32Array(caveParticleCount * 3);
        const caveColors = new Float32Array(caveParticleCount * 3);
        const caveParticleData = [];

        function createRng(seed) {
            let s = seed;
            return function () {
                s = (s * 1103515245 + 12345) & 0x7fffffff;
                return s / 0x7fffffff;
            };
        }
        const caveRng = createRng(54321);

        const caveRadiusX = 7.5;
        const caveRadiusZ = 8.5;
        const caveMinY = centerModelY + 0.4;
        const caveMaxY = centerModelY + 7.5;

        function createGlowTexture(innerColor, outerColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, innerColor);
            gradient.addColorStop(0.15, innerColor);

        // ========== 8. 路径小石头 ==========
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa, roughness: 0.9, flatShading: true });

        function isOnPath(x, z) {
            let minDist = Infinity;
            for (let t = 0; t <= 1; t += 0.005) {
                const pt = cameraCurve.getPoint(t);
                const dx = pt.x - x;
                const dz = pt.z - z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < minDist) minDist = dist;

            if (Math.hypot(x - model2Pos.x, z - model2Pos.z) < minDist) return true;
            if (Math.hypot(x - model3Pos.x, z - model3Pos.z) < minDist) return true;

            if (Math.hypot(x - lptreeRightPos.x, z - lptreeRightPos.z) < 5.0) return true;
            for (let m of mushPositions) if (Math.hypot(x - m.x, z - m.z) < 2.8) return true;
            return false;

                const offsetVec = right.clone().multiplyScalar(offsetDist * side);
                const alongOffset = (Math.random() - 0.5) * 4.0;
                const forwardOffset = tangent.clone().multiplyScalar(alongOffset);
                let posX = pathPoint.x + offsetVec.x + forwardOffset.x;
                let posZ = pathPoint.z + offsetVec.z + forwardOffset.z;
                if (isOnPath(posX, posZ)) { attempts++; continue; }
                let overlap = false;

        // ========== 9. 树木生成 ==========
        const TREE_SCALE_FACTOR = 1.0;
        const exclusionZones = [

            { x: model2Pos.x, z: model2Pos.z, radius: 7.0 },
            { x: model3Pos.x, z: model3Pos.z, radius: 7.0 },

            { x: lptreePos.x, z: lptreePos.z, radius: 5.0 },
            { x: lptreeRightPos.x, z: lptreeRightPos.z, radius: 5.0 }
        ];

        function isInExclusionZone(x, z) {
            for (let zone of exclusionZones) {
                const dx = x - zone.x;
                const dz = z - zone.z;
                if (Math.sqrt(dx * dx + dz * dz) < zone.radius) return true;
            }
            return false;
        }

        const treeCount = 40;
        const distantTreeCount = 30;
        const minDistFromPath = 12.0;
        const maxDistFromPath = 35.0;
        const minDistanceBetweenTrees = 9.0;
        const treeRng = createRng(22);
        const treePositions = [];
        const treeInstances = [];

        function isOverlap(x, z, existing, minDist) {
            for (let pos of existing) {
                if (Math.hypot(pos.x - x, pos.z - z) < minDist) return true;
            }
            return false;
        }

        const texturePath = './textures/tree_Base_color.png';

        function loadTreeModel() {
            const mtlLoader = new MTLLoader();
            mtlLoader.load(mtlPath,
                (materials) => {
                    materials.preload();
                    const objLoader = new OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load(objPath, processTreeModel, undefined, () => loadObjWithoutMtl());
                },
                undefined,
                () => loadObjWithoutMtl()
            );
        }

        function loadObjWithoutMtl() {
            const objLoader = new OBJLoader();
            objLoader.load(objPath, (obj) => {
                obj.traverse(child => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            map: treeTexture,
                            roughness: 0.7,
                            flatShading: true
                        });
                    }
                });
                processTreeModel(obj);
            }, undefined, (err) => console.error('❌ OBJ加载失败:', err));
        }

        function processTreeModel(model) {
            treeTemplate = model;
            treeTemplate.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            if (treeTexture) mat.map = treeTexture;
                            mat.flatShading = true;
                            mat.roughness = 0.7;
                            mat.needsUpdate = true;
                        });
                    }
                }
            });
            generateTreesFromTemplate();
        }

        function generateTreesFromTemplate() {
            if (!treeTemplate) return;
            for (let i = 0; i < treeCount; i++) {
                let attempts = 0, posX, posZ, placed = false;
                while (attempts < 40 && !placed) {
                    const t = treeRng();
                    const pathPoint = cameraCurve.getPoint(t);
                    const tangent = cameraCurve.getTangent(t).normalize();
                    const right = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
                    const side = treeRng() > 0.5 ? 1 : -1;
                    const offsetDist = minDistFromPath + treeRng() * (maxDistFromPath - minDistFromPath);
                    const offsetVec = right.clone().multiplyScalar(offsetDist * side);
                    posX = pathPoint.x + offsetVec.x;
                    posZ = pathPoint.z + offsetVec.z;
                    posX += (treeRng() - 0.5) * 5.0 * tangent.x;
                    posZ += (treeRng() - 0.5) * 5.0 * tangent.z;
                    if (!isOverlap(posX, posZ, treePositions, minDistanceBetweenTrees) && !isInExclusionZone(posX, posZ)) placed = true;
                    attempts++;
                }
                if (placed) {
                    let baseScale = 1.9 + treeRng() * 0.4;
                    const scale = baseScale * TREE_SCALE_FACTOR;
                    const inst = treeTemplate.clone();
                    inst.scale.set(scale, scale, scale);
                    inst.rotation.y = treeRng() * Math.PI * 2;
                    inst.position.set(posX, getTerrainHeight(posX, posZ), posZ);
                    inst.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
                    scene.add(inst);
                    treePositions.push({ x: posX, z: posZ });
                    treeInstances.push({ obj: inst, baseRotY: inst.rotation.y, speed: 0.45 + treeRng() * 0.45, phase: treeRng() * Math.PI * 2, amp: 0.015 + treeRng() * 0.045 });
                }
            }
            for (let i = 0; i < distantTreeCount; i++) {
                let attempts = 0, posX, posZ, placed = false;
                while (attempts < 90 && !placed) {
                    const t = treeRng();
                    const pathPoint = cameraCurve.getPoint(t);
                    const tangent = cameraCurve.getTangent(t).normalize();
                    const right = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
                    const side = treeRng() > 0.5 ? 1 : -1;
                    const offsetDist = 10.5 + treeRng() * 5;
                    const offsetVec = right.clone().multiplyScalar(offsetDist * side);
                    posX = pathPoint.x + offsetVec.x;
                    posZ = pathPoint.z + offsetVec.z;
                    posX += (treeRng() - 0.5) * 6.0 * tangent.x;
                    posZ += (treeRng() - 0.5) * 6.0 * tangent.z;
                    if (!isOverlap(posX, posZ, treePositions, minDistanceBetweenTrees) && !isInExclusionZone(posX, posZ)) placed = true;
                    attempts++;
                }
                if (placed) {
                    let baseScale = 1.9 + treeRng() * 1.6;
                    const scale = baseScale * TREE_SCALE_FACTOR;
                    const inst = treeTemplate.clone();
                    inst.scale.set(scale, scale, scale);

                    t = Math.max(rangeStart, Math.min(rangeEnd, t));
                    let posX, posZ;
                    if (axis === 'x') { posX = t; posZ = fixedVal; }
                    else { posZ = t; posX = fixedVal; }
                    if (avoidCenterGap > 0 && axis === 'x' && Math.abs(posX) < avoidCenterGap && Math.abs(posZ - (-bZ)) < 1) continue;
                    const terrainY = getTerrainHeight(posX, posZ);
                    const instance = stoneTemplate.clone();
                    const scale = 8 + stoneRng() * 8;
                    instance.scale.set(scale, scale, scale);
                    instance.rotation.y = stoneRng() * Math.PI * 2;
                    instance.position.set(posX, terrainY, posZ);
                    scene.add(instance);
                }
            }
            placeOnEdge('x', bZ, -bX, bX, 5);
            placeOnEdge('x', -bZ, -bX, bX, 14, 10);
            placeOnEdge('z', bX, -bZ, bZ, 18);
            placeOnEdge('z', -bX, -bZ, bZ, 18);
        }, undefined, (error) => console.error('❌ 高山石头模型加载失败:', error));

        // ═══════════════════ 棘龙模型 ═══════════════════
        const spinoProgress = 0.85;
        const spinoPathPoint = cameraCurve.getPoint(spinoProgress);
        const spinoTangent = cameraCurve.getTangent(spinoProgress).normalize();
        const { yaw: spinoYaw, pitch: spinoPitch } = getLookAngles(spinoProgress);
        const spinoRight = new THREE.Vector3().crossVectors(spinoTangent, new THREE.Vector3(0,1,0)).normalize();
        const spinoUpDir = new THREE.Vector3().crossVectors(spinoRight, spinoTangent).normalize();
        const spinoLookDir = spinoTangent.clone()
            .applyQuaternion(new THREE.Quaternion().setFromAxisAngle(spinoUpDir, spinoYaw * Math.PI/180))
            .applyQuaternion(new THREE.Quaternion().setFromAxisAngle(spinoRight, spinoPitch * Math.PI/180));
        const spinoDistance = 7.6;
        spinoPosition = spinoPathPoint.clone().add(spinoLookDir.clone().multiplyScalar(spinoDistance));
        spinoPosition.y = getTerrainHeight(spinoPosition.x, spinoPosition.z);
        const spinosaurusLoader = new GLTFLoader();
        const spinosaurusUrl = './models/Allosaur/spinosaurus_dinosaur.glb';
        let spinosaurusMixer = null;
        spinosaurusLoader.load(spinosaurusUrl, (gltf) => {
            const model = gltf.scene;
            spinosaurusModel = model;
            model.scale.set(220, 220, 220);
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const bottomY = center.y - size.y / 3;
            model.position.set(spinoPosition.x, spinoPosition.y - (bottomY + 1), spinoPosition.z);
            model.rotation.y = Math.atan2(spinoLookDir.x, spinoLookDir.z);
            model.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => { mat.flatShading = true; mat.roughness = 0.75; mat.metalness = 0.05; mat.needsUpdate = true; });
                    }
                }
            });
            scene.add(model);
            model.updateMatrixWorld();

            if (gltf.animations && gltf.animations.length) {
                spinosaurusMixer = new THREE.AnimationMixer(model);
                spinosaurusMixer.clipAction(gltf.animations[0]).play();
            }

            const extraDinoLoader = new GLTFLoader();
            const extraDinoUrl = './models/Allosaur/dinosaur.glb';
            extraDinoLoader.load(extraDinoUrl, (gltf2) => {
                const dino = gltf2.scene;
                const dinoScale = 1.0;
                dino.scale.set(dinoScale, dinoScale, dinoScale);
                const spinoRightV = new THREE.Vector3().crossVectors(spinoLookDir, new THREE.Vector3(0, 1, 0)).normalize();
                const leftDir = spinoRightV.clone().negate();
                const leftOffset = -4.0;
                const dinoPos = spinoPosition.clone().add(leftDir.multiplyScalar(leftOffset));
                dinoPos.y = getTerrainHeight(dinoPos.x, dinoPos.z);
                dino.position.copy(dinoPos);
                dino.rotation.y = -Math.atan2(spinoLookDir.x, spinoLookDir.z);
                dino.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach(mat => {
                                mat.flatShading = true;
                                mat.roughness = 0.7;
                                mat.metalness = 0.0;
                                mat.needsUpdate = true;
                            });
                        }
                    }
                });
                scene.add(dino);
                if (gltf2.animations && gltf2.animations.length) {
                    const dinoMixer = new THREE.AnimationMixer(dino);
                    gltf2.animations.forEach(clip => dinoMixer.clipAction(clip).play());
                    if (!window.customMixers) window.customMixers = [];
                    window.customMixers.push(dinoMixer);
                }
            }, undefined, (error) => console.error('❌ 额外恐龙模型加载失败:', error));
        }, undefined, (error) => console.error('❌ 棘龙模型加载失败:', error));

        // ═══════════════════ 🕊️ 橙色鸟模型 ═══════════════════
        const birdPos = { x: centerModelPos.x + 2, z: centerModelPos.z + 12 };
        const birdTerrainY = getTerrainHeight(birdPos.x, birdPos.z);
        const birdY = birdTerrainY + 0.9;
        const birdLoader = new GLTFLoader();
        const birdUrl = './models/Allosaur/bird_orange.glb';
        birdLoader.load(birdUrl, (gltf) => {
            const bird = gltf.scene;
            const birdScale = 0.5;
            bird.scale.set(birdScale, birdScale, birdScale);
            bird.position.set(birdPos.x, birdY, birdPos.z);
            bird.rotation.y = -Math.PI / 3.2;
            bird.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.flatShading = true;
                            mat.roughness = 0.8;
                            mat.metalness = 0.0;
                            mat.needsUpdate = true;
                        });
                    }
                }
            });
            scene.add(bird);
            if (gltf.animations && gltf.animations.length) {
                const birdMixer = new THREE.AnimationMixer(bird);
                gltf.animations.forEach(clip => birdMixer.clipAction(clip).play());
                if (!window.customMixers) window.customMixers = [];
                window.customMixers.push(birdMixer);
            }
        }, undefined, (error) => console.error('❌ 橙色鸟模型加载失败:', error));

        // ═══════════════════ 🦅 飞行鸟群模型 ═══════════════════
        const birdsLoader = new GLTFLoader();
        const birdsUrl = './models/Allosaur/birds.glb';
        let birdsModel = null;
        let birdsMixer = null;
        let circleCenter = null;
        const circleRadius = 9;
        let flyAngle = 0;
        const flySpeed = 0.4;

        birdsLoader.load(birdsUrl, (gltf) => {
            birdsModel = gltf.scene;
            const scale = 2.15;
            birdsModel.scale.set(scale, scale, scale);
            circleCenter = cameraCurve.getPoint(0.45);
            circleCenter.y = getTerrainHeight(circleCenter.x, circleCenter.z) + 18;
            birdsModel.position.copy(circleCenter);
            birdsModel.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.flatShading = true;
                            mat.roughness = 0.8;
                            mat.metalness = 0.0;
                            mat.needsUpdate = true;
                        });
                    }
                }
            });
            scene.add(birdsModel);
            if (gltf.animations && gltf.animations.length) {
                birdsMixer = new THREE.AnimationMixer(birdsModel);
                gltf.animations.forEach(clip => birdsMixer.clipAction(clip).play());
                if (!window.customMixers) window.customMixers = [];
                window.customMixers.push(birdsMixer);
            }
        }, undefined, (error) => console.error('❌ birds.glb 飞行鸟群加载失败:', error));

        // ========== 光照 ==========
        const ambient = new THREE.AmbientLight(0xf4bf73, 0.65);
        scene.add(ambient);
        const sunLight = new THREE.DirectionalLight(0xf0b870, 1.5);
        sunLight.position.set(35, 30, 45);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 60;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);
        const backLight = new THREE.DirectionalLight(0xaaccff, 0.6);
        backLight.position.set(-25, 15, -50);
        scene.add(backLight);
        const fillLight = new THREE.PointLight(0xffaa88, 0.4);
        fillLight.position.set(0, 20, 10);
        scene.add(fillLight);

        // 丁达尔光束
        const godRayLength = 60;
        const godRayRadiusTop = 2.2;
        const godRayRadiusBottom = 9.5;
        const godRayCylinderGeo = new THREE.CylinderGeometry(godRayRadiusTop, godRayRadiusBottom, godRayLength, 32, 1, true);
        const godRayVertexShader = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPos.xyz;
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const godRayFragmentShader = `
            uniform vec3 uColor;
            uniform float uIntensity;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                float distToCenter = length(vUv - 0.5) * 2.0;
                float radialAlpha = 1.0 - smoothstep(0.0, 1.0, distToCenter);
                radialAlpha = pow(radialAlpha, 1.0);
                float verticalAlpha = smoothstep(0.0, 1.0, vUv.y);
                verticalAlpha = pow(verticalAlpha, 1.2);
                float alpha = radialAlpha * verticalAlpha * uIntensity;
                gl_FragColor = vec4(uColor, alpha);
            }
        `;
        const godRayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(0xffd953) },
                uIntensity: { value: 0.05 }
            },
            vertexShader: godRayVertexShader,
            fragmentShader: godRayFragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide,
        });
        const godRayMesh = new THREE.Mesh(godRayCylinderGeo, godRayMaterial);
        godRayMesh.renderOrder = 999;
        const midProgress = 0.2;
        const midPoint = cameraCurve.getPoint(midProgress);
        const midTerrainY = getTerrainHeight(midPoint.x, midPoint.z);
        const beamEnd = new THREE.Vector3(midPoint.x, midTerrainY + 0.2, midPoint.z);
        const startX = 30, startZ = 5;
        const horDist = Math.hypot(beamEnd.x - startX, beamEnd.z - startZ);
        const angleDeg = 65;
        const startY = beamEnd.y + horDist * Math.tan(angleDeg * Math.PI/180);
        const beamStart = new THREE.Vector3(startX, startY, startZ);
        const beamDir = new THREE.Vector3().subVectors(beamEnd, beamStart).normalize();
        const beamLength = beamStart.distanceTo(beamEnd);
        godRayMesh.scale.y = beamLength / godRayLength;
        godRayMesh.position.copy(beamStart.clone().add(beamEnd).multiplyScalar(0.5));
        const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), beamDir);
        godRayMesh.applyQuaternion(quat);
        scene.add(godRayMesh);

        // ═══════════════════ 🎵 背景音乐 ═══════════════════
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const bgmAudio = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('./audio/bgm.mp3', (buffer) => {
            bgmAudio.setBuffer(buffer);
            bgmAudio.setLoop(true);
            bgmAudio.setVolume(0.5);
            bgmAudio.autoplay = true;
            if (listener.context.state === 'suspended') {
                listener.context.resume().then(() => bgmAudio.play());
            } else {
                bgmAudio.play();
            }
        }, undefined, (error) => console.error('❌ 背景音乐加载失败:', error));

        // 音效
        const roarAudio = new THREE.Audio(listener);
        const roarLoader = new THREE.AudioLoader();
        let roarReady = false;
        roarLoader.load('./audio/roar.mp3', (buffer) => {
            roarAudio.setBuffer(buffer);
            roarAudio.setVolume(1.2);
            roarReady = true;
        });

        const musicToggleBtn = document.getElementById('musicToggle');
        musicToggleBtn.addEventListener('click', () => {
            if (!bgmAudio || !bgmAudio.buffer) return;
            if (bgmAudio.isPlaying) {
                bgmAudio.pause();
                musicToggleBtn.textContent = '🕨';
                musicToggleBtn.title = '播放音乐';
            } else {
                bgmAudio.play();
                musicToggleBtn.textContent = '🕩';
                musicToggleBtn.title = '暂停音乐';
            }
        });
        const enterBtn = document.getElementById('enterBtn');
const imageOverlay = document.getElementById('imageOverlay');

if (enterBtn) {
    enterBtn.addEventListener('click', () => {
        const titleEl = document.getElementById('startTitle');
        if (titleEl) titleEl.style.display = 'none';
        if (imageOverlay) {
            imageOverlay.classList.add('show');
            setTimeout(() => {
                imageOverlay.classList.remove('show');
                if (titleEl) {
                    titleEl.style.display = '';
                    titleEl.style.opacity = '1';
                }
                // 隐藏 ENTER 按钮，不让其再次出现
                if (enterBtn) enterBtn.style.display = 'none';
                currentProgress = 0;
                targetProgress = 0;
                updateCamera(0);
                isWheelEnabled = true;
            }, 1500);
        } else {
            isWheelEnabled = true;
        }
    });
}

        // ========== 滚轮控制 ==========
        let currentProgress = 0.0;
        let targetProgress = 0.0;
        const savedProgress = sessionStorage.getItem('sceneProgress');
        if (savedProgress !== null) {
            const val = parseFloat(savedProgress);
            if (!isNaN(val)) {
                currentProgress = val;
                targetProgress = val;
            }
        }

        const wheelStep = 0.01;
        const smoothFactor = 0.05;
        const LOCK_PROGRESS = 0.85;
        let isWheelEnabled = false; 

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!isWheelEnabled) return;  
            if (currentProgress >= LOCK_PROGRESS) return;
            targetProgress += (e.deltaY > 0) ? wheelStep : -wheelStep;
            targetProgress = Math.min(LOCK_PROGRESS, Math.max(0.0, targetProgress));
        }, { passive: false });

        function updateCamera(progress) {
            let pos = cameraCurve.getPoint(progress);
            pos.y = Math.max(pos.y, getTerrainHeight(pos.x, pos.z) + 0.5);
            camera.position.copy(pos);
            const tangent = cameraCurve.getTangent(progress).normalize();
            const { yaw, pitch } = getLookAngles(progress);
            const right = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
            const upDir = new THREE.Vector3().crossVectors(right, tangent).normalize();
            const dir = tangent.clone().applyQuaternion(new THREE.Quaternion().setFromAxisAngle(upDir, yaw * Math.PI/180))
                .applyQuaternion(new THREE.Quaternion().setFromAxisAngle(right, pitch * Math.PI/180));
            camera.lookAt(pos.clone().add(dir.multiplyScalar(15)));
        }

        updateCamera(currentProgress);

        const clock = new THREE.Clock();
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            currentProgress += (targetProgress - currentProgress) * smoothFactor;
            time += delta;

            treeInstances.forEach(item => {
                const obj = item.obj;
                const swing = Math.sin(time * item.speed + item.phase) * item.amp;
                obj.rotation.z = swing;
                obj.rotation.x = swing * 0.5;
                obj.rotation.y = item.baseRotY + swing * 0.2;
            });

            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3 + 1;
                const baseY = particleInitialY[i];
                positions[idx] = baseY + Math.sin(time * 0.8 + i) * 0.4;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            const now = performance.now() * 0.001;
            const posArr = caveParticles.geometry.attributes.position.array;
            for (let i = 0; i < caveParticleCount; i++) {
                const pd = caveParticleData[i];
                const idx = i * 3;
                let nx = pd.baseX + Math.sin(now * pd.speedX + pd.phaseX) * pd.ampX;
                let ny = pd.baseY + Math.sin(now * pd.speedY + pd.phaseY) * pd.ampY;
                let nz = pd.baseZ + Math.cos(now * pd.speedZ + pd.phaseZ) * pd.ampZ;
                if (Math.abs(nx - centerModelPos.x) > caveRadiusX || Math.abs(nz - centerModelPos.z) > caveRadiusZ) {
                    nx = pd.baseX - Math.sin(now * pd.speedX + pd.phaseX) * pd.ampX * 0.5;
                    nz = pd.baseZ - Math.cos(now * pd.speedZ + pd.phaseZ) * pd.ampZ * 0.5;
                }
                ny = Math.min(caveMaxY, Math.max(caveMinY, ny));
                posArr[idx] = nx;
                posArr[idx + 1] = ny;
                posArr[idx + 2] = nz;
            }
            caveParticles.geometry.attributes.position.needsUpdate = true;
            caveParticleMat.opacity = 0.7 + Math.sin(now * 0.8) * 0.15;
            godRayMaterial.uniforms.uIntensity.value = 0.5 + Math.sin(now * 0.5) * 0.08;

            plantMixers.forEach(mixer => mixer.update(delta));
            if (window.customMixers) window.customMixers.forEach(mixer => mixer.update(delta));

            if (pteranodonMixer) pteranodonMixer.update(delta);
            if (spinosaurusMixer) spinosaurusMixer.update(delta);
            if (trexMixer) trexMixer.update(delta);

            if (pteranodonModel && currentProgress >= 0.21) {
                if (!pteranodonFlying) pteranodonFlying = true;
                const forwardDir = new THREE.Vector3(Math.sin(pteranodonModel.rotation.y), 0, Math.cos(pteranodonModel.rotation.y));
                const reverseDir = forwardDir.negate();
                const speed = 0.08;
                pteranodonModel.position.x += reverseDir.x * speed;
                pteranodonModel.position.z += reverseDir.z * speed;
                pteranodonModel.position.y += 0.025;
            }

            butterflies.forEach(b => {
                b.mesh.visible = currentProgress >= 0.25;
                b.progress += b.speed * delta;
                if (b.progress > 1.0) b.progress -= 1.0;
                if (b.mesh.visible) {
                    const point = cameraCurve.getPoint(b.progress);
                    b.mesh.position.copy(point);
                    b.mesh.position.y += b.height;
                    if (b.isModel) {
                        const tangent = cameraCurve.getTangent(b.progress).normalize();
                        b.mesh.rotation.y = Math.atan2(tangent.x, tangent.z) + Math.PI;
                        if (b.mixer) b.mixer.update(delta);
                    }
                }
            });

            if (birdsModel && circleCenter) {
                flyAngle += delta * flySpeed;
                flyAngle %= (Math.PI * 2);
                birdsModel.position.set(circleCenter.x + circleRadius * Math.cos(flyAngle), circleCenter.y, circleCenter.z + circleRadius * Math.sin(flyAngle));
                birdsModel.rotation.y = Math.atan2(-Math.sin(flyAngle), Math.cos(flyAngle)) + Math.PI;
            }

            const titleEl = document.getElementById('startTitle');
            if (titleEl) {
                const fadeThreshold = 0.04;
                titleEl.style.opacity = Math.max(0, 1 - currentProgress / fadeThreshold);
            }

            // 棘龙提示（仅靠近时显示一次）
            const hintEl = document.getElementById('spinoHint');
            if (hintEl && spinoPosition) {
                const nearSpino = Math.abs(currentProgress - 0.85) < 0.03;
                if (nearSpino && !spinoHintShown) {
                    const hintWorldPos = spinoPosition.clone().add(new THREE.Vector3(0, 6.5, 0));
                    const screenPos = hintWorldPos.clone().project(camera);
                    if (screenPos.z > 0 && screenPos.z < 1) {
                        const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                        const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
                        hintEl.style.left = x + 'px';
                        hintEl.style.top = y + 'px';
                        if (!spinoHintTimer) {
                            hintEl.style.opacity = '1';
                            spinoHintTimer = setTimeout(() => {
                                hintEl.style.opacity = '0';
                                spinoHintShown = true;
                                spinoHintTimer = null;
                            }, 2000);
                        }
                    } else {
                        hintEl.style.opacity = '0';
                    }
                } else {
                    hintEl.style.opacity = '0';
                    if (spinoHintTimer) {
                        clearTimeout(spinoHintTimer);
                        spinoHintTimer = null;
                    }
                }
            }

            updateCamera(currentProgress);
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🎨 场景已启动');
    </script>
</body>
